name: Research validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the publication Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - name: Install the recorded npm version
        run: npm install --global npm@10.9.3 --ignore-scripts --no-audit --no-fund
      - name: Install pinned Anvil release
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.5
      - name: Validate publication and recorded evidence
        run: python3 scripts/validate-publication.py
      - name: Fetch verified source and install locked dependencies
        run: bash experiments/setup.sh
      - name: Run scoped application, chain, recovery and benchmark checks
        run: bash experiments/run.sh
      - name: Confirm published evidence stayed unchanged
        run: |
          python3 scripts/validate-publication.py
          git diff --exit-code
      - name: Retain fresh runtime and result records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoped-research-results
          path: results/local/
          if-no-files-found: warn
          retention-days: 14
