<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#40586b"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="21" fill="#182d3c"><text x="155" y="35" text-anchor="middle" font-size="21">Compromised authority</text><text x="490" y="35" text-anchor="middle" font-size="21">Capability</text><text x="825" y="35" text-anchor="middle" font-size="21">Security consequence</text><rect x="20" y="65" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="155.0" y="117.0" text-anchor="middle" font-size="21">One signer</text><rect x="355" y="65" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="490.0" y="117.0" text-anchor="middle" font-size="21">Leak share or abort</text><rect x="690" y="65" width="290" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="835.0" y="103.5" text-anchor="middle" font-size="21">Quorum still needed</text><text x="835.0" y="130.5" text-anchor="middle" font-size="21">Availability can suffer</text><path d="M290 110L355 110" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M625 110L690 110" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="188" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="155.0" y="240.0" text-anchor="middle" font-size="21">Threshold quorum</text><rect x="355" y="188" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="490.0" y="240.0" text-anchor="middle" font-size="21">Sign outside app policy</text><rect x="690" y="188" width="290" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="835.0" y="226.5" text-anchor="middle" font-size="21">Direct transaction authority</text><text x="835.0" y="253.5" text-anchor="middle" font-size="21">Approval service bypassed</text><path d="M290 233L355 233" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M625 233L690 233" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="311" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="155.0" y="363.0" text-anchor="middle" font-size="21">Coordinator</text><rect x="355" y="311" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="490.0" y="363.0" text-anchor="middle" font-size="21">Delay or retain signatures</text><rect x="690" y="311" width="290" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="835.0" y="336.0" text-anchor="middle" font-size="21">New signatures require</text><text x="835.0" y="363.0" text-anchor="middle" font-size="21">valid evidence</text><text x="835.0" y="390.0" text-anchor="middle" font-size="21">Issued bytes are portable</text><path d="M290 356L355 356" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M625 356L690 356" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="434" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="155.0" y="486.0" text-anchor="middle" font-size="21">Recovery controller</text><rect x="355" y="434" width="270" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="490.0" y="472.5" text-anchor="middle" font-size="21">Roll back both state</text><text x="490.0" y="499.5" text-anchor="middle" font-size="21">and checkpoint</text><rect x="690" y="434" width="290" height="90" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="835.0" y="459.0" text-anchor="middle" font-size="21">Old history can return</text><text x="835.0" y="486.0" text-anchor="middle" font-size="21">Requires trusted</text><text x="835.0" y="513.0" text-anchor="middle" font-size="21">external state</text><path d="M290 479L355 479" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M625 479L690 479" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="500" y="590" text-anchor="middle" font-size="19">Consequences are conditional on the stated compromise and key possession.</text></g></svg>