<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#40586b"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="21" fill="#182d3c"><rect x="25" y="25" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="160.0" y="68.5" text-anchor="middle" font-size="21">1  Create intent</text><text x="160.0" y="95.5" text-anchor="middle" font-size="21">Recipient value chain</text><rect x="365" y="25" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="500.0" y="68.5" text-anchor="middle" font-size="21">2  Canonical encoding</text><text x="500.0" y="95.5" text-anchor="middle" font-size="21">Exact unsigned bytes</text><rect x="705" y="25" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="840.0" y="68.5" text-anchor="middle" font-size="21">3  Approval signatures</text><text x="840.0" y="95.5" text-anchor="middle" font-size="21">Digest policy and expiry</text><rect x="705" y="210" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="840.0" y="253.5" text-anchor="middle" font-size="21">4  Verify policy</text><text x="840.0" y="280.5" text-anchor="middle" font-size="21">Independent signer checks</text><rect x="365" y="210" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="500.0" y="253.5" text-anchor="middle" font-size="21">5  Threshold signing</text><text x="500.0" y="280.5" text-anchor="middle" font-size="21">Produce ECDSA signature</text><rect x="25" y="210" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="160.0" y="253.5" text-anchor="middle" font-size="21">6  Persist signed bytes</text><text x="160.0" y="280.5" text-anchor="middle" font-size="21">Portable authority exists</text><rect x="25" y="400" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="160.0" y="430.0" text-anchor="middle" font-size="21">7  Broadcast validation</text><text x="160.0" y="457.0" text-anchor="middle" font-size="21">Current approval</text><text x="160.0" y="484.0" text-anchor="middle" font-size="21">and policy evidence</text><rect x="365" y="400" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="500.0" y="443.5" text-anchor="middle" font-size="21">8  Network submission</text><text x="500.0" y="470.5" text-anchor="middle" font-size="21">RPC sends same bytes</text><rect x="705" y="400" width="270" height="100" rx="5" fill="#f3f6f8" stroke="#607789" stroke-width="1.5"/><text x="840.0" y="443.5" text-anchor="middle" font-size="21">9  Confirmation</text><text x="840.0" y="470.5" text-anchor="middle" font-size="21">Receipt and finality policy</text><path d="M295 75L365 75" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M635 75L705 75" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M705 260L635 260" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M365 260L295 260" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M295 450L365 450" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M635 450L705 450" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M840 125L840 210" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M160 310L160 400" stroke="#40586b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M160 310L160 355L500 355L500 400" fill="none" stroke="#8a4e3b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="500" y="556" text-anchor="middle" font-size="21">A holder of signed bytes can submit outside application validation.</text><text x="500" y="583" text-anchor="middle" font-size="21">Ordinary transaction validity does not include private approval expiry.</text></g></svg>